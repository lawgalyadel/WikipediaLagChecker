# Every tunable in the project. Nothing here is duplicated in code.

[stream]
url = "https://stream.wikimedia.org/v2/stream/recentchange"
reconnect_initial_seconds = 1.0
reconnect_max_seconds = 60.0
read_timeout_seconds = 60.0

[archive]
directory = "data/raw"
partition_format = "%Y-%m-%d-%H"
offset_file = "data/offset.txt"
# The offset only advances after a flush, so at most this many events are
# re-archived after a hard kill. Lower is safer, higher compresses better.
flush_every_events = 100

[filters]
# Deliberately a mixed set rather than all-European, so the interesting
# asymmetries (does an event reach English before or after the language
# local to where it happened) are visible in the results.
wikis = [
  "enwiki", "dewiki", "frwiki", "eswiki", "ptwiki", "itwiki",
  "nlwiki", "plwiki", "ruwiki", "svwiki", "trwiki", "arwiki",
  "fawiki", "hiwiki", "idwiki", "jawiki", "kowiki", "zhwiki",
]
namespaces = [0]      # main article namespace only
include_bots = false  # bots are archived, then excluded at analysis time

[events]
# `log` events (moves, deletions, protections) are not article edits.
change_types = ["edit", "new"]
# Restarts re-archive up to one flush interval and resumes replay a little
# history, so ids are deduplicated over a bounded window of recent events.
dedupe_window_events = 20000

[wikidata]
api_url = "https://www.wikidata.org/w/api.php"
user_agent = "wikilag/0.1 (https://github.com/lawgalyadel/WikipediaLagChecker)"
batch_size = 50              # API maximum titles per wbgetentities request
cache_size = 50000           # in-memory LRU entries, positive and negative
store_path = "data/wikidata.sqlite"  # frozen resolutions; replay reads these
# Keys per snapshot query. Two bound parameters each; SQLite allows 32766.
store_query_chunk = 500
request_timeout_seconds = 30.0
maxlag_seconds = 5           # ask Wikimedia to refuse us when replicas lag
max_retries = 6
backoff_initial_seconds = 1.0
backoff_max_seconds = 60.0
# Events are resolved in blocks so lookups can be batched across events.
block_events = 5000

[results]
# Every measured number lands here as JSON; the README is generated from it.
directory = "data/results"

[join]
watermark_seconds = 21600  # 6h; events arriving later are counted as dropped
# Edits arrive slightly out of edit-time order (stream p99 skew ~15s).
# They are held this long and processed in timestamp order; anything later
# than this is counted as out-of-order rather than silently reordered.
reorder_seconds = 120
# Windows opening this soon after the archive starts may have had edits
# before capture began, so their leader is unknowable. Excluded, counted.
warmup_seconds = 21600
emit_ranks = [2, 3, 5]  # emit a record when the 2nd, 3rd, 5th edition arrives
# How long a closed window is remembered, to count follow-ups past it.
late_horizon_seconds = 86400
# Language pairs with fewer lag samples than this are not ranked.
min_pair_samples = 20

[bench]
workers = [1, 2, 4]
repeats = 3                          # median wall time is reported
rss_sample_interval_seconds = 0.05   # peak RSS is sampled, main + workers
profile_top_functions = 25

[failures]
candidates = 60                 # records reviewed to find 20 wrong ones
sample_seed = 20260914
sheet_path = "labels/failures.csv"
# Evidence heuristics. They suggest a category; a person confirms it.
bot_user_pattern = "(?i)bot\\b"
revert_comment_patterns = [
  "(?i)\\brevert", "(?i)\\bundid\\b", "(?i)\\brv\\b", "(?i)rückgängig",
  "(?i)annul", "(?i)отмен", "(?i)deshecha", "(?i)revertid", "取り消し", "撤销", "되돌림",
]
trivial_bytes = 10              # |size change| at or below this is maintenance
disambiguation_markers = [
  "(disambiguation)", "(desambiguación)", "(homonymie)", "(Begriffsklärung)",
  "(disambigua)", "(значения)", "(曖昧さ回避)", "(消歧义)",
]

[baseline]
sample_size = 200
sample_seed = 20260913
# Hand labels are a research artefact, so they live in the repo, not data/.
labels_path = "labels/pairs.csv"
