[project]
name = "wikilag"
version = "0.1.0"
description = "Cross-language propagation lag over the Wikimedia edit stream"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "structlog>=24.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 90
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
